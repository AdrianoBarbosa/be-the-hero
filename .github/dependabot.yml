version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /backend
      - /frontend
      - /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
